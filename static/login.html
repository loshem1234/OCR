<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/app.css?v=2"><title>Sign in · Scriptorium OCR</title></head>
<body>
<main class="login-wrap">
  <form class="card login-card" id="f">
    <div id="emblem"></div>
    <h1>Scriptorium</h1>
    <p>OCR &amp; text recovery</p>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" autofocus required>
    <div style="height:12px"></div>
    <button class="primary" style="width:100%;justify-content:center" type="submit">Enter</button>
    <div class="err" id="err"></div>
  </form>
</main>
<script type="module">
import { api, EMBLEM } from "/static/js/common.js";
document.getElementById("emblem").innerHTML = EMBLEM;
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    await api("/api/login", { method: "POST", body: { password: document.getElementById("pw").value } });
    location.href = "/";
  } catch (x) { err.textContent = x.message; }
});
</script>
</body></html>
